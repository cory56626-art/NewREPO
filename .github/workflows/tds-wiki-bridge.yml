name: TDS Wiki Verification Bridge

on:
  push:
    branches:
      - tds-wiki-bridge
    paths:
      - "tds_bridge/request.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and run TDS bridge
        shell: bash
        run: |
          cat tds_bridge/bridge_parts/*.pyfrag > /tmp/tds_bridge.py
          python -m py_compile /tmp/tds_bridge.py
          set +e
          python /tmp/tds_bridge.py
          rc=$?
          set -e
          # Exit 2 means strict resolver needs the user to choose a candidate.
          # That is a valid bridge result, not an infrastructure failure.
          if [ "$rc" -eq 2 ]; then
            exit 0
          fi
          exit "$rc"

      - name: Commit fetched evidence
        if: always()
        run: |
          git config user.name "tds-wiki-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tds_bridge/
          git diff --cached --quiet && exit 0
          git commit -m "Update TDS verification evidence"
          git pull --rebase origin tds-wiki-bridge
          git push
