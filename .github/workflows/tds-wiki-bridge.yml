name: TDS Wiki Bridge

on:
  push:
    branches:
      - tds-wiki-bridge
    paths:
      - "tds_bridge/request.txt"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch requested TDS wiki page
        shell: python
        run: |
          import json, pathlib, urllib.parse, urllib.request

          title = pathlib.Path("tds_bridge/request.txt").read_text(encoding="utf-8").strip()
          if not title:
              raise SystemExit("request.txt is empty")

          params = urllib.parse.urlencode({
              "action": "parse",
              "page": title,
              "prop": "wikitext",
              "format": "json",
          })
          url = "https://tds.fandom.com/api.php?" + params

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "TDSWikiBridge/1.0 (GitHub Actions; read-only)",
                  "Accept": "application/json",
              },
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)

          if "parse" not in data or "wikitext" not in data["parse"]:
              raise SystemExit(json.dumps(data)[:1000])

          text = data["parse"]["wikitext"]["*"]
          pathlib.Path("tds_bridge/result.txt").write_text(text, encoding="utf-8")
          pathlib.Path("tds_bridge/meta.json").write_text(
              json.dumps({
                  "requested": title,
                  "title": data["parse"].get("title"),
                  "pageid": data["parse"].get("pageid"),
                  "source": url,
              }, indent=2),
              encoding="utf-8",
          )

      - name: Commit fetched page
        run: |
          git config user.name "tds-wiki-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tds_bridge/result.txt tds_bridge/meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Update TDS wiki bridge result"
          git push
