name: TDS Secret Probe

on:
  push:
    branches:
      - claude/pacing-hams-game-n6pya2
    paths:
      - "tds_bridge/secret_probe_request.txt"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FANDOM_BOT_USERNAME: ${{ secrets.FANDOM_BOT_USERNAME }}
      FANDOM_BOT_PASSWORD: ${{ secrets.FANDOM_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secret availability
        shell: python
        run: |
          import json, os, pathlib
          result = {
              "has_username": bool(os.environ.get("FANDOM_BOT_USERNAME", "")),
              "has_password": bool(os.environ.get("FANDOM_BOT_PASSWORD", ""))
          }
          pathlib.Path("tds_bridge").mkdir(exist_ok=True)
          pathlib.Path("tds_bridge/secret_probe_result.json").write_text(
              json.dumps(result, indent=2) + "\n",
              encoding="utf-8"
          )

      - name: Commit probe result
        run: |
          git config user.name "tds-secret-probe[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tds_bridge/secret_probe_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Update TDS secret probe result"
          git push
