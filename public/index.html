<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Skyhand">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="A cloud browser that Claude drives for you, live on your phone.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Skyhand</title>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-kbd" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M8 14h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-enter" viewBox="0 0 24 24"><path d="M19 6v5a3 3 0 0 1-3 3H6M10 10l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </svg>

  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <img src="icon.svg" alt="" width="64" height="64">
      <h1>Skyhand</h1>
      <p>Enter the password you set as <code>APP_PASSWORD</code>.</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit">Unlock</button>
      <p id="loginError" class="login-error" role="alert"></p>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <header class="bar">
      <button id="back" class="icon" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <button id="fwd" class="icon" aria-label="Forward"><svg><use href="#i-fwd"/></svg></button>
      <form id="urlForm" class="url">
        <input id="url" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search or enter address" aria-label="Address">
      </form>
      <button id="reload" class="icon" aria-label="Reload"><svg><use href="#i-reload"/></svg></button>
      <button id="gear" class="icon" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </header>

    <main id="stage" class="stage">
      <div id="screen" class="screen">
        <canvas id="view" aria-label="Live view of the cloud browser"></canvas>
        <div id="cursor" class="cursor idle" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2.5l15.5 9.2-6.9 1.6-3.4 6.4z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span id="cursorLabel" class="cursor-label"></span>
        </div>
        <div id="conn" class="conn">Connecting…</div>
      </div>
    </main>

    <section id="sheet" class="sheet">
      <button id="handle" class="handle" aria-label="Expand chat"></button>
      <div id="log" class="log" aria-live="polite"></div>
      <div id="status" class="status" hidden><span class="spark"></span><span id="statusText">Thinking…</span></div>
      <form id="typer" class="typer" hidden>
        <input id="typerInput" type="text" enterkeyhint="send" autocapitalize="off" autocomplete="off" placeholder="Type into the page">
        <button type="submit" class="icon small" aria-label="Type and press Enter"><svg><use href="#i-enter"/></svg></button>
        <button type="button" id="typerClose" class="icon small" aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </form>
      <form id="composer" class="composer">
        <button type="button" id="kbd" class="icon" aria-label="Type into the page"><svg><use href="#i-kbd"/></svg></button>
        <textarea id="prompt" rows="1" enterkeyhint="send" placeholder="Ask Claude to do anything…" aria-label="Message Claude"></textarea>
        <button id="send" class="send" aria-label="Send"><svg><use href="#i-send"/></svg></button>
      </form>
    </section>

    <dialog id="settings" class="settings">
      <form method="dialog">
        <h2>Settings</h2>
        <label class="field-label">Thinking</label>
        <div class="seg" data-key="effort">
          <button type="button" data-value="low">Fast</button>
          <button type="button" data-value="medium">Balanced</button>
          <button type="button" data-value="high">Thorough</button>
        </div>
        <label class="switch">
          <span><strong>Turbo</strong><br><small>Claude writes up to 2.5× faster. Costs 2× per token.</small></span>
          <input id="turbo" type="checkbox">
        </label>
        <label class="field-label">Browser shape</label>
        <div class="seg" data-key="mode">
          <button type="button" data-value="phone">Phone</button>
          <button type="button" data-value="desktop">Desktop</button>
        </div>
        <div class="row">
          <button type="button" id="newChat" class="ghost">New chat</button>
          <button type="button" id="signOut" class="ghost">Sign out</button>
          <button value="close" class="primary">Done</button>
        </div>
      </form>
    </dialog>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
