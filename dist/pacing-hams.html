// Immediate-mode input. Everything on screen is drawn to the canvas, so every
// clickable thing is just a rectangle tested during render. Clicks live for exactly
// one frame and are consumed by the first region that claims them, which means
// draw order is also hit-test order — draw modal layers last and let them swallow
// what is left with `consumeRemaining()`.

const VIEW_W = 1600;
const VIEW_H = 900;

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.x = VIEW_W / 2;
    this.y = VIEW_H / 2;
    /** Normalised -1..1 offset from screen centre, for parallax. */
    this.nx = 0;
    this.ny = 0;
    this.down = false;
    this.pendingClick = null;
    this.pendingRightClick = null;
    this.wheel = 0;
    this.keysDown = new Set();
    this.keysPressed = new Set();
    this.hovering = false;
    this.anyInputYet = false;

    canvas.addEventListener('pointermove', (e) => this._move(e));
    canvas.addEventListener('pointerdown', (e) => {
      this._move(e);
      this.down = true;
      this.anyInputYet = true;
    });
    canvas.addEventListener('pointerup', (e) => {
      this._move(e);
      if (this.down) {
        if (e.button === 2) this.pendingRightClick = { x: this.x, y: this.y };
        else this.pendingClick = { x: this.x, y: this.y };
      }
      this.down = false;
    });
    canvas.addEventListener('pointerleave', () => { this.down = false; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.wheel += Math.sign(e.deltaY);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (['Tab', 'Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
      if (!this.keysDown.has(e.code)) this.keysPressed.add(e.code);
      this.keysDown.add(e.code);
      this.anyInputYet = true;
    });
    window.addEventListener('keyup', (e) => this.keysDown.delete(e.code));
    window.addEventListener('blur', () => { this.keysDown.clear(); this.down = false; });
  }

  _move(e) {
    const r = this.canvas.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    this.x = ((e.clientX - r.left) / r.width) * VIEW_W;
    this.y = ((e.clientY - r.top) / r.height) * VIEW_H;
    this.nx = (this.x / VIEW_W) * 2 - 1;
    this.ny = (this.y / VIEW_H) * 2 - 1;
    this.anyInputYet = true;
  }

  beginFrame() { this.hovering = false; }

  endFrame() {
    this.pendingClick = null;
    this.pendingRightClick = null;
    this.wheel = 0;
    this.keysPressed.clear();
    this.canvas.classList.toggle('pointing', this.hovering);
  }

  held(code) { return this.keysDown.has(code); }
  pressed(code) { return this.keysPressed.has(code); }
  pressedAny(...codes) { return codes.some((c) => this.keysPressed.has(c)); }

  inRect(r) {
    return this.x >= r.x && this.x <= r.x + r.w && this.y >= r.y && this.y <= r.y + r.h;
  }

  /** Hover test that also flags the pointer cursor. */
  hover(r) {
    const on = this.inRect(r);
    if (on) this.hovering = true;
    return on;
  }

  /** Returns true once, on the frame the region was clicked. */
  clicked(r) {
    if (!this.pendingClick) return false;
    const c = this.pendingClick;
    if (c.x >= r.x && c.x <= r.x + r.w && c.y >= r.y && c.y <= r.y + r.h) {
      this.pendingClick = null;
      return true;
    }
    return false;
  }

  /** Swallow any click that no region claimed. Call last, from modal backdrops. */
  consumeRemaining() {
    const had = !!this.pendingClick;
    this.pendingClick = null;
    return had;
  }
}

// One update per rendered frame with a clamped delta, plus the letterboxed 16:9
// canvas sizing. Game code always draws in a 1600x900 coordinate space and never
// has to think about device pixel ratio or window size.
//
// This deliberately is *not* a fixed-timestep accumulator. There is no physics
// here, every animation is already frame-rate independent, and an accumulator
// that runs update() twice in a slow frame makes edge-triggered input fire twice
// — which silently cancels every keyboard toggle in the game.

const { VIEW_W, VIEW_H } = __req("src/core/input.js");

const MAX_FRAME = 1 / 15;

function fitCanvas(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  const scale = Math.min(availW / VIEW_W, availH / VIEW_H);
  const cssW = Math.max(320, Math.floor(VIEW_W * scale));
  const cssH = Math.max(180, Math.floor(VIEW_H * scale));
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const bw = Math.floor(cssW * dpr);
  const bh = Math.floor(cssH * dpr);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  return bw / VIEW_W;
}

function startLoop({ canvas, ctx, update, render }) {
  let last = performance.now() / 1000;
  let scale = fitCanvas(canvas);
  window.addEventListener('resize', () => { scale = fitCanvas(canvas); });

  const frame = (nowMs) => {
    const now = nowMs / 1000;
    let dt = now - last;
    last = now;
    if (dt > MAX_FRAME) dt = MAX_FRAME;
    if (dt < 0) dt = 0;

    update(dt);

    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);
    render(ctx, dt);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

  __exp["fitCanvas"] = fitCanvas;
  __exp["startLoop"] = startLoop;

};

// The run state and its persistence. Kept deliberately plain-JSON so a save is
// just a structural clone of this object.

const SAVE_KEY = 'pacing-hams:save:v1';

const state = {
  version: 1,
  seed: 1,
  day: 1,
  money: 240,
  reputation: 50,
  units: [],
  residents: [],
  upgrades: {},
  stats: {
    processed: 0,
    admitted: 0,
    denied: 0,
    mimicsCaught: 0,
    mimicsAdmitted: 0,
    wrongDenials: 0,
    murders: 0,
    murdersSolved: 0,
    innocentsLost: 0,
    daysSurvived: 0,
  },
  today: null,
  lastNight: null,
  endless: false,
  finished: false,
  settings: { muted: false },
};

function assign(next) {
  for (const k of Object.keys(next)) state[k] = next[k];
  return state;
}

function save() {
  try {
    const copy = JSON.parse(JSON.stringify(state));
    copy.today = null; // shifts are never resumed mid-pig
    localStorage.setItem(SAVE_KEY, JSON.stringify(copy));
    return true;
  } catch (e) {
    console.warn('[state] save failed', e);
    return false;
  }
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.version !== 1) return false;
    assign(data);
    return true;
  } catch (e) {
    console.warn('[state] load failed', e);
    return false;
  }
}

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch { return false; }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch { /* ignore */ }
}

const livingResidents = () => state.residents.filter((r) => r.alive);
const mimicsInside = () => state.residents.filter((r) => r.alive && r.isMimic);
const hasUpgrade = (id) => !!state.upgrades[id];

// Everything you hear is synthesised at runtime — no audio files ship with the
// game. The room tone is a filtered noise bed plus a mains hum; every one-shot is
// a short envelope over noise or a couple of oscillators.

let ctx = null;
let master = null;
let bed = null;
let muted = false;
let started = false;

function ac() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.9;
    master.connect(ctx.destination);
  }
  return ctx;
}

function noiseBuffer(seconds = 2, brown = false) {
  const c = ac();
  const len = Math.floor(c.sampleRate * seconds);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  let lastOut = 0;
  for (let i = 0; i < len; i++) {
    const white = Math.random() * 2 - 1;
    if (brown) {
      lastOut = (lastOut + 0.02 * white) / 1.02;
      d[i] = lastOut * 3.5;
    } else {
      d[i] = white;
    }
  }
  return buf;
}

/** Must be called from a user gesture on most browsers. */
function unlock() {
  const c = ac();
  if (!c) return;
  if (c.state === 'suspended') c.resume();
  if (!started) {
    started = true;
    startRoomTone();
  }
}

function startRoomTone() {
  const c = ac();
  bed = c.createGain();
  bed.gain.value = 0.0;
  bed.connect(master);

  // Low rumble of a building that shouldn't still have power.
  const rumble = c.createBufferSource();
  rumble.buffer = noiseBuffer(4, true);
  rumble.loop = true;
  const rumbleFilter = c.createBiquadFilter();
  rumbleFilter.type = 'lowpass';
  rumbleFilter.frequency.value = 180;
  const rumbleGain = c.createGain();
  rumbleGain.gain.value = 0.55;
  rumble.connect(rumbleFilter).connect(rumbleGain).connect(bed);
  rumble.start();

  // Mains hum from the lamp.
  const hum = c.createOscillator();
  hum.type = 'sawtooth';
  hum.frequency.value = 50;
  const humFilter = c.createBiquadFilter();
  humFilter.type = 'lowpass';
  humFilter.frequency.value = 320;
  const humGain = c.createGain();
  humGain.gain.value = 0.020;
  hum.connect(humFilter).connect(humGain).connect(bed);
  hum.start();

  // Air.
  const air = c.createBufferSource();
  air.buffer = noiseBuffer(4, false);
  air.loop = true;
  const airFilter = c.createBiquadFilter();
  airFilter.type = 'bandpass';
  airFilter.frequency.value = 900;
  airFilter.Q.value = 0.6;
  const airGain = c.createGain();
  airGain.gain.value = 0.012;
  air.connect(airFilter).connect(airGain).connect(bed);
  air.start();

}

// Atmosphere passes that run over the top of every scene: the lamp's pool of
// light, the vignette that swallows the corners, and the film grain that keeps
// large flat gradients from banding.

const { VIEW_W, VIEW_H } = __req("src/core/input.js");

let grainTile = null;

function buildGrain() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 118 + Math.random() * 74;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  grainTile = c;
}

function grain(ctx, alpha = 0.05) {
  if (!grainTile) buildGrain();
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = alpha;
  const ox = -Math.floor(Math.random() * 128);
  const oy = -Math.floor(Math.random() * 128);

  ctx.translate(ox, oy);
  ctx.fillStyle = pat;
  ctx.fillRect(0, 0, VIEW_W + 128, VIEW_H + 128);
  ctx.restore();
}

function vignette(ctx, strength = 1, cx = VIEW_W / 2, cy = VIEW_H * 0.44) {

  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.55, `rgba(0,0,0,${0.25 * strength})`);
  g.addColorStop(1, `rgba(0,0,0,${0.93 * strength})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

/** Warm bloom cast down from the bulb. */

  g.addColorStop(0.35, `rgba(255, 168, 84, ${0.16 * intensity})`);
  g.addColorStop(1, 'rgba(255, 140, 40, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

/** A soft cone of light falling from the shade. */

  g.addColorStop(0.45, `rgba(255,168,84,${0.055 * intensity})`);
  g.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - spread * 0.22, y);
  ctx.lineTo(x + spread * 0.22, y);
  ctx.lineTo(x + spread, y + length);
  ctx.lineTo(x - spread, y + length);
  ctx.closePath();

  ctx.restore();

  g.addColorStop(0.78, `rgba(0,0,0,${darkness * 0.82})`);

  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.restore();
}

// warm light, cold shadow, aged paper. Anything that isn't in the lamp's reach

  woodMid: '#5a3618',
  woodLow: '#2c190b',
  woodEdge: '#1a0e05',

  paper: '#cdbb95',
  paperShade: '#b3a07c',
  paperEdge: '#8e7c5c',
  paperOld: '#c0aa80',

  inkFaded: '#5a4a33',
  inkRed: '#8e2a22',

  hideDark: '#2a1712',
  snout: '#ac7d70',
  gum: '#7d4a48',
  tusk: '#e0d6ba',

  amber: '#e8b45c',
  amberDim: '#8a6a34',
  amberBright: '#ffd98a',
  textDim: '#6b5836',
  danger: '#c1362b',
  dangerDim: '#5e1c16',

/**
 * Parses '#rgb', '#rrggbb', 'rgb(...)' and 'rgba(...)' alike.
 *
 * These helpers return `rgb(...)` strings, so they get composed — `shade(mix(a,

 * back NaN components, and canvas silently ignores an invalid fillStyle and
 * keeps painting with the previous colour, which is a miserable thing to debug.

function parseColour(colour) {
  if (typeof colour !== 'string') return [0, 0, 0, 1];
  const s = colour.trim();
  if (s[0] === '#') {
    const h = s.slice(1);
    const full = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;

function mix(a, b, t) {

/** Darken or lighten a colour by a factor. */
function shade(colour, f) {

  const cl = (v) => Math.max(0, Math.min(255, Math.round(v * f)));

// Seeded deterministic randomness. Every pig, document and night is reproducible
// from a single integer seed, which is what makes the ID photo and the pig in the
// chair two views of the same creature rather than two rolls of the dice.

function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/** mulberry32 — small, fast, good enough spread for our purposes. */
function makeRng(seed) {
  let a = (typeof seed === 'string' ? hashString(seed) : seed >>> 0) || 1;
  const rng = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (min, max) => Math.floor(rng() * (max - min + 1)) + min;
  rng.range = (min, max) => rng() * (max - min) + min;
  rng.chance = (p) => rng() < p;
  rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
  rng.pickWeighted = (entries) => {
    // entries: [[value, weight], ...]
    let total = 0;
    for (const [, w] of entries) total += w;
    let roll = rng() * total;
    for (const [v, w] of entries) {
      roll -= w;
      if (roll <= 0) return v;
    }
    return entries[entries.length - 1][0];
  };
  rng.shuffle = (arr) => {
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };
  /** Take up to n distinct items. */
  rng.sample = (arr, n) => rng.shuffle(arr).slice(0, n);
  rng.seed = () => rng.int(1, 2147483646);
  return rng;
}

/** Deterministic value noise, used for wood grain, stains and film grain. */
function noise2d(x, y, seed = 0) {

  n = (n ^ (n >>> 13)) >>> 0;
  n = Math.imul(n, 1274126177) >>> 0;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

// Every drawn element goes through this registry. Today each name maps to a
// procedural function; when hand-drawn art arrives, call `overrideWithImage()` and
// the same name starts drawing a bitmap instead — no game logic changes.
//
//   definePainter('desk.surface', (ctx, o) => { ...canvas drawing... });
//   paint(ctx, 'desk.surface', { width: 1600 });
//
//   // later, with art:
//   overrideWithImage('desk.surface', './assets/desk.png', { x: 0, y: 520, w: 1600, h: 380 });

const painters = new Map();
const overrides = new Map();

function definePainter(name, fn) {
  painters.set(name, fn);
}

function paint(ctx, name, opts = {}) {
  const ov = overrides.get(name);
  if (ov && ov.image && ov.image.complete && ov.image.naturalWidth > 0) {
    const d = typeof ov.dest === 'function' ? ov.dest(opts) : ov.dest;
    ctx.drawImage(ov.image, d.x, d.y, d.w, d.h);
    if (ov.alsoProcedural !== true) return;
  }
  const fn = painters.get(name);
  if (!fn) {
    if (!paint._warned) paint._warned = new Set();
    if (!paint._warned.has(name)) {
      paint._warned.add(name);
      console.warn('[painters] no painter registered for', name);
    }
    return;
  }
  fn(ctx, opts);
}

function hasPainter(name) {
  return painters.has(name);
}

/**
 * Swap a procedural painter for a bitmap.
 * @param {string} name        painter id, e.g. 'pig.head'
 * @param {string} url         image path
 * @param {object|function} dest  {x,y,w,h} in 1600x900 space, or (opts) => rect
 * @param {object} extra       { alsoProcedural: true } to draw art *and* code
 */
function overrideWithImage(name, url, dest, extra = {}) {
  const image = new Image();
  image.src = url;
  overrides.set(name, { image, dest, ...extra });
  return image;
}

function clearOverride(name) {
  overrides.delete(name);
}

/** Bulk-load a manifest: { 'desk.surface': { url, dest }, ... } */
function loadArtManifest(manifest) {
  for (const [name, cfg] of Object.entries(manifest)) {
    overrideWithImage(name, cfg.url, cfg.dest, cfg);
  }
}

function addDays(date, n) {
  let { d, m, y } = date;
  d += n;
  while (d > MONTH_DAYS[m - 1]) {
    d -= MONTH_DAYS[m - 1];
    m++;
    if (m > 12) { m = 1; y++; }
  }
  while (d < 1) {
    m--;

function checkLetter(digits) {

const DIALOGUE_TOPICS = ['unit', 'sponsor', 'since', 'district', 'occupation', 'name', 'idNumber'];

// ---------------------------------------------------------------------------
// Case construction
// ---------------------------------------------------------------------------

function pickKind(rng, day) {
  const vacant = vacantUnits().length;
  const residents = state.residents.filter((r) => r.alive).length;
  const options = [];
  if (vacant > 0) options.push(['NEW', day < 3 ? 10 : 6]);
  if (day >= 4 && residents > 0) options.push(['RESIDENT', day < 7 ? 3 : 5]);
  if (day >= 6 && vacant > 0) options.push(['TRANSFER', 3]);
  if (!options.length) options.push(['RESIDENT', 1]);
  return rng.pickWeighted(options);
}

function docTypesFor(kind, day) {
  const docs = ['ID_CARD'];
  if (kind === 'RESIDENT') docs.push('RESIDENT_PASS');
  else docs.push('RESIDENCY_PERMIT');

  if (day >= 3 && kind !== 'RESIDENT') docs.push('WORK_CHIT');

      'Persistent cough. Ward air. Not contagious.',
      'Underweight. Recommend feeding.',

// Small easing + spring helpers. The head tilt, the lamp sway and every scene
// transition run through these so motion always feels weighted rather than snapped.

const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = (t) => {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
};

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));

/** Frame-rate independent exponential approach. `speed` is roughly "per second". */
function approach(current, target, speed, dt) {
  return lerp(current, target, 1 - Math.exp(-speed * dt));
}

/** A value that eases toward whatever you set it to. */
class Smooth {
  constructor(value = 0, speed = 8) {
    this.value = value;
    this.target = value;
    this.speed = speed;
  }
  set(target) { this.target = target; return this; }
  snap(value) { this.value = this.target = value; return this; }
  update(dt) {
    this.value = approach(this.value, this.target, this.speed, dt);
    return this.value;
  }
  get done() { return Math.abs(this.value - this.target) < 0.0005; }
}

/** One-shot timeline: t goes 0 -> 1 over `duration`, then stays. */
class Timer {
  constructor(duration = 1) { this.duration = duration; this.elapsed = 0; }
  reset(duration = this.duration) { this.duration = duration; this.elapsed = 0; return this; }
  update(dt) { this.elapsed = Math.min(this.duration, this.elapsed + dt); return this.t; }
  get t() { return this.duration <= 0 ? 1 : this.elapsed / this.duration; }
  get done() { return this.elapsed >= this.duration; }
}

  __exp["easeInCubic"] = easeInCubic;
  __exp["easeInOutCubic"] = easeInOutCubic;
  __exp["easeOutBack"] = easeOutBack;
  __exp["clamp"] = clamp;
  __exp["lerp"] = lerp;
  __exp["invLerp"] = invLerp;
  __exp["approach"] = approach;
  __exp["Smooth"] = Smooth;

__defs["src/art/pig.js"] = (__exp) => {
// One creature, drawn two ways.
//
// `drawPig` renders a feature set at any size in one of two modes: 'scene' (the
// animal sitting in the chair, lit from above by the desk lamp) and 'photo' (the
// desaturated bust printed on an identity card). Both read the *same* feature
// object, so when a mimic's papers carry a mutated feature set the difference is
// genuinely visible rather than a hidden dice roll.

const { P, rgba, shade, mix } = __req("src/art/palette.js");
const { makeRng, noise2d } = __req("src/core/rng.js");
const { definePainter, paint } = __req("src/art/painters.js");

const photoCache = new Map();

function hideColour(f) {
  const base = P.hide[f.hide % P.hide.length];
  return shade(base, 1 + f.hideShift);
}

const EYE_HEX = {
  AMBER: '#d9962f', GREY: '#9a968c', BLACK: '#2b2622',
  'PALE BLUE': '#9db6c4', GREEN: '#7f9159', PINK: '#c98d97',
};

// ---------------------------------------------------------------------------
// Shapes
// ---------------------------------------------------------------------------

function headPath(ctx, f) {
  const w = 92 * f.headW;
  const h = 104 * f.headH;
  const jowl = 1 + f.jowl * 0.22;
  const cx = 0, cy = -58;
  ctx.beginPath();
  ctx.moveTo(cx, cy - h * 0.5);                                       // crown
  ctx.bezierCurveTo(cx + w * 0.62, cy - h * 0.46, cx + w * 0.58, cy - h * 0.05, cx + w * 0.52 * jowl, cy + h * 0.22);
  ctx.bezierCurveTo(cx + w * 0.48 * jowl, cy + h * 0.44, cx + w * 0.24, cy + h * 0.52, cx, cy + h * 0.52);
  ctx.bezierCurveTo(cx - w * 0.24, cy + h * 0.52, cx - w * 0.48 * jowl, cy + h * 0.44, cx - w * 0.52 * jowl, cy + h * 0.22);
  ctx.bezierCurveTo(cx - w * 0.58, cy - h * 0.05, cx - w * 0.62, cy - h * 0.46, cx, cy - h * 0.5);
  ctx.closePath();
}

/** The ear outline, in ear-local space. */
function earShape(ctx, f) {
  const s = 34 * f.earSize;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.55);
  ctx.bezierCurveTo(-s * 0.62, s * 0.1, -s * 0.5, -s * 0.95, 0, -s * 1.25);
  ctx.bezierCurveTo(s * 0.5, -s * 0.95, s * 0.62, s * 0.1, 0, s * 0.55);
  ctx.closePath();
}

/**
 * Moves the context into ear-local space and leaves it there — the caller draws
 * the inner ear and the notch in the same space, and is responsible for the
 * surrounding save/restore.
 */
function earPath(ctx, f, side) {
  const w = 92 * f.headW;
  ctx.translate(side * w * 0.44, -96 * f.headH + 4);
  ctx.rotate(side * (0.24 + f.earDroop * 0.85));
  earShape(ctx, f);
}

function snoutRect(f) {
  return {
    x: 0,
    y: -20 + f.snoutTilt * 6,
    w: 44 * f.snoutW,
    h: 31 * (0.85 + f.snoutLen * 0.32),
  };
}

// ---------------------------------------------------------------------------
// Detail passes
// ---------------------------------------------------------------------------

function mottle(ctx, f, seed) {
  // Uneven, dirty skin. Cheap, but it stops the hide reading as flat plastic.
  const rng = makeRng(seed ^ 0x9e37);
  ctx.save();
  ctx.globalAlpha = 0.075;
  for (let i = 0; i < 26; i++) {
    const x = rng.range(-52, 52);
    const y = rng.range(-108, 4);
    const r = rng.range(4, 15);
    ctx.fillStyle = rng.chance(0.5) ? '#000' : '#ffd9b0';
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * rng.range(0.5, 1), rng.range(0, 3.14), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEye(ctx, f, side, { blink = 0, reveal = false }) {
  const x = side * 20 * f.eyeSpacing;
  const y = -70 + f.brow * 4;
  const r = 6.3 * f.eyeSize;
  const open = 1 - blink;

  // socket — deep, so the eyes read as set into the skull rather than stuck on
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.beginPath();
  ctx.ellipse(x, y + 1, r * 2.1, r * 1.9, 0, 0, Math.PI * 2);
  ctx.fill();

  if (open > 0.06) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.25, r * 1.05 * open, 0, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = '#a89c88';
    ctx.fillRect(x - r * 1.4, y - r * 1.4, r * 2.8, r * 2.8);

    const iris = EYE_HEX[f.eyeColour] || '#9a968c';
    ctx.fillStyle = iris;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.78, r * 0.78, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.beginPath();
    ctx.ellipse(x, y, r * (reveal ? 0.5 : 0.34), r * (reveal ? 0.5 : 0.34), 0, 0, Math.PI * 2);
    ctx.fill();

    // upper lid shadow — the light is above, so the top of the eye is always dark
    const g = ctx.createLinearGradient(0, y - r * 1.3, 0, y + r * 0.4);
    g.addColorStop(0, 'rgba(0,0,0,0.75)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r * 1.6, y - r * 1.6, r * 3.2, r * 2.4);

    // wet specular
    ctx.fillStyle = 'rgba(255,240,210,0.9)';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.3, y - r * 0.34, r * 0.2, r * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // lid line
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.ellipse(x, y, r * 1.25, r * 1.05 * Math.max(open, 0.05), 0, 0, Math.PI * 2);
  ctx.stroke();
}

function drawSnout(ctx, f, { talk = 0 }) {
  const s = snoutRect(f);
  // Snouts take their colour from the animal, so a dark hide doesn't end up
  // wearing a bright pink disc in the middle of its face.
  const base = mix(P.hide[f.hide % P.hide.length], P.snout, 0.5);
  const grd = ctx.createLinearGradient(0, s.y - s.h * 0.6, 0, s.y + s.h * 0.7);
  grd.addColorStop(0, shade(base, 1.24));
  grd.addColorStop(0.55, shade(base, 0.98));
  grd.addColorStop(1, shade(base, 0.36));

  ctx.save();
  // contact shadow where the snout meets the face
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, s.y + 4, s.w * 0.56, s.h * 0.62, 0, 0, Math.PI * 2);
  ctx.filter = 'none';
  ctx.fill();

  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.ellipse(0, s.y, s.w * 0.5, s.h * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // nostrils
  const nw = 5.2 * f.nostril;
  ctx.fillStyle = 'rgba(28,14,12,0.92)';
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(side * s.w * 0.17, s.y + s.h * 0.04, nw * 0.5, nw * 0.86, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // wet highlight
  ctx.fillStyle = 'rgba(255,236,205,0.34)';
  ctx.beginPath();
  ctx.ellipse(-s.w * 0.16, s.y - s.h * 0.26, s.w * 0.14, s.h * 0.1, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // mouth
  const open = talk * 7;
  ctx.strokeStyle = 'rgba(20,10,8,0.75)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-s.w * 0.42, s.y + s.h * 0.62);
  ctx.quadraticCurveTo(0, s.y + s.h * 0.72 + open, s.w * 0.42, s.y + s.h * 0.62);
  ctx.stroke();
  if (open > 1.2) {
    ctx.fillStyle = '#170b09';
    ctx.beginPath();
    ctx.moveTo(-s.w * 0.36, s.y + s.h * 0.63);
    ctx.quadraticCurveTo(0, s.y + s.h * 0.72 + open, s.w * 0.36, s.y + s.h * 0.63);
    ctx.quadraticCurveTo(0, s.y + s.h * 0.66, -s.w * 0.36, s.y + s.h * 0.63);
    ctx.fill();
  }
}

function drawTusks(ctx, f) {
  if (f.tusk <= 0.02) return;
  const s = snoutRect(f);
  const len = 6 + f.tusk * 13;
  ctx.fillStyle = shade(P.tusk, 0.72);
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * s.w * 0.52, s.y + s.h * 0.6);
    ctx.rotate(side * -0.25);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(side * 3, -len * 0.6, side * 1.5, -len);
    ctx.quadraticCurveTo(side * -2.4, -len * 0.5, -side * 2.4, 1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

function drawScar(ctx, f) {
  if (f.scar === 'none') return;
  ctx.save();
  ctx.strokeStyle = 'rgba(120,58,52,0.85)';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (f.scar === 'brow') {
    ctx.moveTo(-30, -92); ctx.lineTo(-16, -62);
  } else if (f.scar === 'cheek') {
    ctx.moveTo(34, -66); ctx.lineTo(24, -34);
  } else {
    ctx.moveTo(-14, -30); ctx.lineTo(12, -14);
  }
  ctx.stroke();
  // cross stitches
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = 'rgba(90,42,38,0.7)';
  for (let i = 0.2; i < 0.9; i += 0.22) {
    ctx.save();
    if (f.scar === 'brow') ctx.translate(-30 + 14 * i, -92 + 30 * i);
    else if (f.scar === 'cheek') ctx.translate(34 - 10 * i, -66 + 32 * i);
    else ctx.translate(-14 + 26 * i, -30 + 16 * i);
    ctx.beginPath();
    ctx.moveTo(-4, -3); ctx.lineTo(4, 3);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawBristles(ctx, f, seed) {
  const n = Math.round(4 + f.bristle * 9);
  const rng = makeRng(seed ^ 0x51ab);
  ctx.strokeStyle = 'rgba(20,12,8,0.6)';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const t = (i / (n - 1)) * 2 - 1;
    const x = t * 34 * f.headW;
    const y = -58 - 52 * f.headH + Math.abs(t) * 9;
    const len = 6 + f.bristle * 10 + rng.range(-2, 3);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + t * 3, y - len * 0.7, x + t * 6 + rng.range(-2, 2), y - len);
    ctx.stroke();
  }
}

function drawBody(ctx, f, { mode }) {
  // Narrower shoulders in a photograph, or the bust overruns the frame.
  const w = 150 * f.neck * (mode === 'photo' ? 0.74 : 0.92);
  const top = 6;
  const bottom = mode === 'photo' ? 78 : 230;
  const g = ctx.createLinearGradient(0, top, 0, bottom);
  g.addColorStop(0, shade(hideColour(f), 0.42));
  g.addColorStop(0.4, shade(hideColour(f), 0.2));
  g.addColorStop(1, '#0a0705');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-w * 0.28, top - 14);
  ctx.bezierCurveTo(-w * 0.55, top + 4, -w * 0.9, top + 34, -w * 1.02, bottom);
  ctx.lineTo(w * 1.02, bottom);
  ctx.bezierCurveTo(w * 0.9, top + 34, w * 0.55, top + 4, w * 0.28, top - 14);
  ctx.closePath();
  ctx.fill();

  // collar of a coat, so they aren't naked torsos
  ctx.fillStyle = 'rgba(24,18,12,0.9)';
  ctx.beginPath();
  ctx.moveTo(-w * 0.34, top - 8);
  ctx.quadraticCurveTo(0, top + 30, w * 0.34, top - 8);
  ctx.quadraticCurveTo(w * 0.2, top + 46, 0, top + 52);
  ctx.quadraticCurveTo(-w * 0.2, top + 46, -w * 0.34, top - 8);
  ctx.fill();
}

// ---------------------------------------------------------------------------
// Main
// ---------------------------------------------------------------------------

/**
 * @param {CanvasRenderingContext2D} ctx
 * @param {object} f      feature set
 * @param {object} o      { x, y, scale, mode, seed, blink, talk, breath, lean, reveal, lightY }
 */
function drawPig(ctx, f, o = {}) {
  const {
    x = 0, y = 0, scale = 1, mode = 'scene', seed = 1,
    blink = 0, talk = 0, breath = 0, lean = 0, reveal = false,
  } = o;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.rotate(lean * 0.06);
  ctx.translate(0, breath * 2.2);

  drawBody(ctx, f, { mode });

  // ears sit behind the skull
  for (const side of [-1, 1]) {
    ctx.save();
    earPath(ctx, f, side);
    const eg = ctx.createLinearGradient(0, -30, 0, 20);
    eg.addColorStop(0, shade(hideColour(f), 0.95));
    eg.addColorStop(1, shade(hideColour(f), 0.3));
    ctx.fillStyle = eg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // inner ear
    ctx.beginPath();
    ctx.ellipse(0, -8, 9 * f.earSize, 17 * f.earSize, 0, 0, Math.PI * 2);
    ctx.fillStyle = rgba('#3a1d1a', 0.6);
    ctx.fill();

    // notch — a bite taken out of one ear, and a tell we can forge.
    // Painted as a dark wedge rather than cut out with destination-out: that
    // would punch a real hole through the room already drawn behind the pig.
    if ((f.earNotch === 'left' && side === -1) || (f.earNotch === 'right' && side === 1)) {
      ctx.save();
      earShape(ctx, f);
      ctx.clip();
      ctx.beginPath();
      ctx.moveTo(side * 2, -26 * f.earSize);
      ctx.lineTo(side * 30, -34 * f.earSize);
      ctx.lineTo(side * 4, -11 * f.earSize);
      ctx.closePath();
      ctx.fillStyle = 'rgba(6,4,3,0.96)';
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // skull
  ctx.save();
  headPath(ctx, f);
  ctx.clip();

  const hg = ctx.createLinearGradient(0, -118 * f.headH, 0, 10);
  // The bulb is directly overhead, so the falloff is steep — but the top two
  // thirds of the face have to stay legible, because comparing it to the
  // photograph on the card is the whole game.
  hg.addColorStop(0, shade(hideColour(f), 1.42));
  hg.addColorStop(0.34, shade(hideColour(f), 1.14));
  hg.addColorStop(0.72, shade(hideColour(f), 0.56));
  hg.addColorStop(1, shade(hideColour(f), 0.24));
  ctx.fillStyle = hg;
  ctx.fillRect(-90, -130, 180, 160);

  mottle(ctx, f, seed);

  // brow shadow
  const bg = ctx.createLinearGradient(0, -92, 0, -60);
  bg.addColorStop(0, 'rgba(0,0,0,0)');
  bg.addColorStop(1, `rgba(0,0,0,${0.16 + f.brow * 0.2})`);
  ctx.fillStyle = bg;
  ctx.fillRect(-90, -92, 180, 34);
  ctx.restore();

  // head outline keeps it readable against the dark room
  ctx.save();
  headPath(ctx, f);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.restore();

  drawBristles(ctx, f, seed);
  drawEye(ctx, f, -1, { blink, reveal });
  drawEye(ctx, f, 1, { blink, reveal });
  if (reveal) {
    // a mimic stops bothering with the right number of eyes
    ctx.save();
    ctx.globalAlpha = 0.9;
    drawEye(ctx, { ...f, eyeSpacing: f.eyeSpacing * 2.05, eyeSize: f.eyeSize * 0.62 }, -1, { blink: 0, reveal: true });
    drawEye(ctx, { ...f, eyeSpacing: f.eyeSpacing * 2.05, eyeSize: f.eyeSize * 0.62 }, 1, { blink: 0, reveal: true });

  ctx.fillStyle = active ? P.amberBright : (hovered ? P.amber : 'rgba(170,138,80,0.8)');

const pauseIcon = (ctx) => {

};

const boltIcon = (ctx) => {
  ctx.beginPath();
  ctx.moveTo(3, -12);
  ctx.lineTo(-7, 2);
  ctx.lineTo(-1, 2);
  ctx.lineTo(-3, 12);
  ctx.lineTo(7, -3);
  ctx.lineTo(1, -3);
  ctx.closePath();
  ctx.fill();
};

const speakerIcon = (muted) => (ctx) => {
  ctx.beginPath();
  ctx.moveTo(-9, -4); ctx.lineTo(-4, -4); ctx.lineTo(1, -10);
  ctx.lineTo(1, 10); ctx.lineTo(-4, 4); ctx.lineTo(-9, 4);

  ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(5, -6); ctx.lineTo(12, 6);

    ctx.arc(2, 0, 7, -0.9, 0.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(2, 0, 11, -0.8, 0.8);

/**

function drawHud(ctx, input, o = {}) {
  const { lampOn = true, showMoney = true } = o;
  const hits = {
    pause: iconButton(ctx, input, HUD_RECTS.pause, pauseIcon),
    lamp: iconButton(ctx, input, HUD_RECTS.lamp, boltIcon, { active: lampOn }),
    mute: iconButton(ctx, input, HUD_RECTS.mute, speakerIcon(isMuted())),
  };

  if (showMoney) {
    // Counts up rather than snapping, like a till.
    if (shownMoney === null) shownMoney = state.money;
    shownMoney += (state.money - shownMoney) * 0.12;
    if (Math.abs(state.money - shownMoney) < 0.6) shownMoney = state.money;
    const value = Math.round(shownMoney);

    ctx.save();
    ctx.shadowColor = 'rgba(255,170,70,0.55)';
    ctx.shadowBlur = 22;

/**
 * The stack the player can leaf through on the left of the desk.
 * The resident file only appears when the applicant names an occupied unit —
 * which for a genuine new tenant never happens.
 */
function buildRegistryDocs(day, activeCase, rules) {
  const docs = [
    bulletinDoc(day, rules),
    rosterDoc(day),
    ledgerDoc(day),
    visitorLogDoc(day, activeCase ? activeCase.plantedVisit : null),
  ];
  if (activeCase) {
    const claimed = residentByUnit(activeCase.claim.unit);
    if (claimed) docs.push(residentFileDoc(claimed, day));
  }
  if (hasUpgrade('records_archive')) docs.push(archiveDoc(day));
  if (hasUpgrade('records_watch')) docs.push(watchDoc(day));
  if (hasUpgrade('records_cross')) docs.push(wardRegisterDoc(day));
  for (const d of docs) d.cacheKey = `${d.id}:${d.version}`;
  return docs;
}

//   DESK     the room, the applicant, their papers, the three buttons

        lean: Math.sin(t * 22) * 0.05,
      };
    }
    if (phase === 'HAND' || phase === 'SEATED') {
      return { x: VIEW_W / 2, y: SEAT_Y, scale: PIG_SCALE, lean: 0 };
    }
    return null;
  }

  function drawApplicant(ctx) {
    const pose = applicantPose();
    if (!pose) return;
    const breathing = Math.sin(game.t * 1.7) * (current.isMimic ? 0.35 : 1);
    drawPig(ctx, current.identity.features, {
      x: pose.x + px.value * 10,
      y: pose.y + py.value * 5,
      scale: pose.scale,
      seed: current.seed,
      mode: 'scene',
      blink: current.isMimic && hasUpgrade('desk_lamp') ? blink * 0.25 : blink,
      talk: talk * 0.9,
      breath: breathing,
      // A small constant list per applicant, so nobody sits perfectly square on.
      lean: pose.lean + ((current.seed % 7) - 3) * 0.007,
    });
  }

  function drawDeskProps(ctx) {
    // The Complex's records, always to hand on the left.
    const recHover = phase === 'SEATED' && view === 'DESK' && input.hover(SLOTS.recordsStack);
    drawStack(ctx, SLOTS.recordsStack, {
      count: Math.min(5, regDocs.length || 3),
      seed: 12,
      hover: recHover,
      label: 'COMPLEX RECORDS',
    });
    if (recHover && input.clicked(SLOTS.recordsStack)) {
      view = 'RECORDS';
      sfx.paper();
    }

    // Their papers, once handed over.
    if (docs.length && (phase === 'HAND' || phase === 'SEATED' || phase === 'LEAVE')) {
      const t = phase === 'HAND' ? easeOutCubic(hand.t) : phase === 'LEAVE' ? 1 - easeOutCubic(leave.t) : 1;
      const slot = SLOTS.applicantDocs;
      const fromY = 470;
      ctx.save();
      ctx.globalAlpha = clamp(t * 1.4, 0, 1);
      docs.forEach((doc, i) => {
        const spread = (i - (docs.length - 1) / 2);
        const box = {
          x: slot.x + spread * 26,
          y: lerp(fromY, slot.y, t) + i * 6,
          w: slot.w,
          h: slot.h,
        };
        drawDocument(ctx, doc, box, {
          rotate: (spread * 0.05) + (1 - t) * 0.4,
          offsetY: -docLift.value * (i === docIndex ? 6 : 0),
        });
      });
      ctx.restore();

      const hovered = phase === 'SEATED' && view === 'DESK' && input.hover(slot);
      if (hovered) {
        ctx.save();
        ctx.strokeStyle = rgba(P.amberBright, 0.8);
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(slot.x - 26, slot.y - 12, slot.w + 52, slot.h + 26);
        ctx.setLineDash([]);
        ctx.restore();
        if (input.clicked(slot)) {
          view = 'INSPECT';
          sfx.paperBig();
        }
      }
      text(ctx, 'THEIR PAPERS', slot.x + slot.w / 2, slot.y - 14, {
        size: 12, colour: hovered ? P.amberBright : 'rgba(150,120,70,0.6)', align: 'center', spacing: 3,
      });
    }

    // Buttons.
    const live = phase === 'SEATED';
    const redHover = live && input.hover(circleRect(SLOTS.red));
    const greenHover = live && input.hover(circleRect(SLOTS.green));
    const yellowHover = live && input.hover(circleRect(SLOTS.yellow));

    drawDeskButton(ctx, {
      x: SLOTS.red.x, y: SLOTS.red.y, r: SLOTS.red.r,
      colour: P.danger, dim: P.dangerDim, hover: redHover,
      glow: live ? 0.5 : 0, label: 'REFUSE', disabled: !live,
    });
    drawDeskButton(ctx, {
      x: SLOTS.yellow.x, y: SLOTS.yellow.y, r: SLOTS.yellow.r,
      colour: P.caution, dim: P.cautionDim, hover: yellowHover,
      glow: live && questionsLeft > 0 ? 0.6 : 0,
      label: live ? `ASK · ${questionsLeft}` : 'ASK',
      disabled: !live || questionsLeft <= 0,
    });
    drawDeskButton(ctx, {
      x: SLOTS.green.x, y: SLOTS.green.y, r: SLOTS.green.r,
      colour: P.ok, dim: P.okDim, hover: greenHover,
      glow: live ? 0.5 : 0, label: 'ADMIT', disabled: !live,
    });

    if (live) {
      if (input.clicked(circleRect(SLOTS.red))) verdict(false);
      if (input.clicked(circleRect(SLOTS.green))) verdict(true);
      if (questionsLeft > 0 && input.clicked(circleRect(SLOTS.yellow))) {
        view = 'INSPECT';
        asking = true;
        sfx.clunk();
      }
      const cmpHover = input.hover(SLOTS.compare);
      drawPlate(ctx, SLOTS.compare, 'COMPARE', { hover: cmpHover, active: view === 'COMPARE' });
      if (input.clicked(SLOTS.compare)) {
        view = view === 'COMPARE' ? 'DESK' : 'COMPARE';
        sfx.paperBig();
      }
    }
  }

  const circleRect = (c) => rect(c.x - c.r * 1.2, c.y - c.r, c.r * 2.4, c.r * 2.1);

  // --- document views -------------------------------------------------------

  function drawDocPager(ctx, list, idx, box, o = {}) {
    const doc = list[idx];
    const placed = drawDocument(ctx, doc, box, {});
    // title tabs
    const tabW = Math.min(156, (box.w - 20) / list.length);
    const tabRowW = list.length * (tabW + 6) - 6;
    list.forEach((d, i) => {
      const r = rect(box.x + (box.w - tabRowW) / 2 + i * (tabW + 6), box.y - 42, tabW, 30);
      tab(ctx, r, d.title.split(' ').slice(0, 2).join(' '), i === idx);
      if (input.hover(r) && input.clicked(r)) {
        if (o.onPick) o.onPick(i);
        sfx.paper();
      }
    });
    return placed;
  }

  function drawInspect(ctx) {
    scrim(ctx, 0.88);
    const box = rect(VIEW_W / 2 - 400, 140, 800, 660);
    const placed = drawDocPager(ctx, docs, docIndex, box, { onPick: (i) => { docIndex = i; } });
    const doc = docs[docIndex];

    // loupe: ring anything that fails a check the player could do by hand
    if (hasUpgrade('desk_loupe')) {
      for (const flag of autoFlags(doc, current)) {
        const field = placed.data.fields.find((f) => f.id === flag.id);
        if (!field) continue;
        const r = placed.toScreen(field.rect);
        ctx.save();
        ctx.strokeStyle = rgba(P.danger, 0.85);
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.setLineDash([]);
        text(ctx, flag.why, r.x + r.w + 10, r.y + r.h / 2 + 4, { size: 11, colour: P.danger, spacing: 1.4 });
        ctx.restore();
      }
    }
    if (hasUpgrade('desk_uv') && current.claim.sealed === false
      && (doc.type === 'RESIDENCY_PERMIT' || doc.type === 'RESIDENT_PASS')) {
      text(ctx, 'UV: NO REGISTRY SEAL PRESENT', VIEW_W / 2, box.y + box.h + 6, {
        size: 13, colour: P.danger, align: 'center', spacing: 2,
      });
    }

    // asking mode: every askable field becomes a target
    if (asking) {
      let anyHover = false;
      for (const field of placed.data.fields) {
        if (!isAskable(field.id)) continue;
        const r = placed.toScreen(field.rect);
        const hovered = input.hover(r);
        anyHover = anyHover || hovered;
        ctx.save();
        ctx.fillStyle = hovered ? rgba(P.caution, 0.26) : rgba(P.caution, 0.10);
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = hovered ? P.caution : rgba(P.caution, 0.45);
        ctx.lineWidth = hovered ? 2 : 1;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.restore();
        if (current.answered[field.id]) {
          text(ctx, 'ASKED', r.x + r.w - 4, r.y - 4, { size: 9, colour: rgba(P.caution, 0.8), align: 'right' });
        }
        if (hovered && input.clicked(r)) {
          askAbout(field.id);
          if (questionsLeft <= 0) asking = false;
        }
      }
      text(ctx, `ASK ABOUT A FIELD — ${questionsLeft} QUESTION${questionsLeft === 1 ? '' : 'S'} LEFT`, VIEW_W / 2, 62, {
        size: 15, colour: P.caution, align: 'center', spacing: 3,
      });
    } else {
      text(ctx, 'THEIR PAPERS', VIEW_W / 2, 62, { size: 15, colour: P.amber, align: 'center', spacing: 5 });
    }

    if (arrow(ctx, input, rect(80, VIEW_H / 2 - 60, 92, 120), -1, { disabled: docs.length < 2 })) page(-1);
    if (arrow(ctx, input, rect(VIEW_W - 172, VIEW_H / 2 - 60, 92, 120), 1, { disabled: docs.length < 2 })) page(1);

    if (button(ctx, input, rect(VIEW_W - 210, 40, 170, 40), 'BACK  [ESC]')) {
      view = 'DESK';
      asking = false;
      sfx.paper();
    }
    if (!asking && questionsLeft > 0 && button(ctx, input, rect(40, 40, 190, 40), `ASK ABOUT THIS  [${questionsLeft}]`, { tone: P.caution })) {
      asking = true;
      sfx.clunk();
    }
    hint(ctx, '← → PAGE   ·   C COMPARE   ·   ESC BACK');
    input.consumeRemaining();
  }

  function drawRecordsOverlay(ctx) {
    // Held up in the left of the view, room still visible — the head is tilted.
    const box = rect(170, 128, 600, 660);
    ctx.save();
    ctx.fillStyle = 'rgba(4,3,2,0.72)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.restore();

    text(ctx, 'THE COMPLEX — RECORDS', box.x + box.w / 2, 62, {
      size: 15, colour: P.amber, align: 'center', spacing: 4,
    });
    drawDocPager(ctx, regDocs, regIndex, box, { onPick: (i) => { regIndex = i; } });

    // Both page arrows sit under the sheet rather than out over the room.
    if (arrow(ctx, input, rect(box.x + 130, VIEW_H - 84, 100, 56), -1, { disabled: regDocs.length < 2 })) page(-1);
    if (arrow(ctx, input, rect(box.x + box.w - 230, VIEW_H - 84, 100, 56), 1, { disabled: regDocs.length < 2 })) page(1);
    text(ctx, regDocs[regIndex].title, box.x + box.w / 2, VIEW_H - 100, {
      size: 12, colour: 'rgba(170,140,84,0.8)', align: 'center', spacing: 2,
    });

    if (button(ctx, input, rect(VIEW_W - 300, 150, 220, 46), 'PUT DOWN  [ESC]')) {
      view = 'DESK';
      sfx.paper();
    }
    if (button(ctx, input, rect(VIEW_W - 300, 208, 220, 46), 'COMPARE  [C]', { tone: P.caution })) {
      view = 'COMPARE';
      sfx.paperBig();
    }
    text(ctx, 'Everything the Complex knows', VIEW_W - 190, 280, {
      size: 12, colour: 'rgba(160,130,78,0.6)', align: 'center',
    });
    text(ctx, 'about the people already inside it.', VIEW_W - 190, 300, {
      size: 12, colour: 'rgba(160,130,78,0.6)', align: 'center',
    });
    input.consumeRemaining();
  }

  function drawCompare(ctx) {
    scrim(ctx, 0.9);
    // Both columns stop well short of the bottom so their pagers never end up
    // underneath the HUD controls or the money counter.
    const left = rect(56, 122, 700, 606);
    const right = rect(VIEW_W / 2 + 44, 122, 700, 606);

    text(ctx, 'COMPLEX RECORDS', left.x + left.w / 2, 92, { size: 14, colour: P.amber, align: 'center', spacing: 4 });
    text(ctx, 'APPLICANT', right.x + right.w / 2, 92, { size: 14, colour: P.amber, align: 'center', spacing: 4 });

    ctx.save();
    ctx.strokeStyle = 'rgba(140,110,60,0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(VIEW_W / 2, 120);
    ctx.lineTo(VIEW_W / 2, VIEW_H - 90);
    ctx.stroke();
    ctx.restore();

    drawDocument(ctx, regDocs[regIndex], left, {});
    const placedRight = drawDocument(ctx, docs[docIndex], right, {});

    if (hasUpgrade('desk_loupe')) {
      for (const flag of autoFlags(docs[docIndex], current)) {
        const field = placedRight.data.fields.find((f) => f.id === flag.id);
        if (!field) continue;
        const r = placedRight.toScreen(field.rect);
        ctx.save();
        ctx.strokeStyle = rgba(P.danger, 0.9);
        ctx.lineWidth = 2.5;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        ctx.restore();
      }
    }

    const pagerY = left.y + left.h + 16;
    const pager = (box, list, idx, set) => {
      const cx = box.x + box.w / 2;
      if (arrow(ctx, input, rect(cx - 210, pagerY, 64, 46), -1, { disabled: list.length < 2 })) {
        set((idx - 1 + list.length) % list.length);
        sfx.paper();
      }
      if (arrow(ctx, input, rect(cx + 146, pagerY, 64, 46), 1, { disabled: list.length < 2 })) {
        set((idx + 1) % list.length);
        sfx.paper();
      }
      text(ctx, list[idx].title, cx, pagerY + 28, {
        size: 12, colour: 'rgba(178,146,88,0.85)', align: 'center', spacing: 2,
      });
      text(ctx, `${idx + 1} / ${list.length}`, cx, pagerY + 48, {
        size: 10, colour: 'rgba(150,122,72,0.6)', align: 'center', spacing: 2,
      });
    };
    pager(left, regDocs, regIndex, (i) => { regIndex = i; });
    pager(right, docs, docIndex, (i) => { docIndex = i; });

    if (button(ctx, input, rect(VIEW_W / 2 - 90, 36, 180, 40), 'BACK  [C]')) {
      view = 'DESK';
      sfx.paper();
    }
    input.consumeRemaining();
  }

  // --- overlays -------------------------------------------------------------

  function drawSubtitle(ctx) {
    if (!subtitle) return;
    const fade = clamp((subtitle.ttl - subtitle.life) * 2.5, 0, 1);
    // Sits just above the desk edge so it never covers the papers.
    const y = 524;
    ctx.save();
    ctx.globalAlpha = fade;
    const w = 940;
    const x = VIEW_W / 2 - w / 2;
    const lines = [];
    if (subtitle.question) lines.push({ t: `“${subtitle.question}”`, c: 'rgba(190,158,96,0.8)', s: 14 });
    lines.push({ t: `“${subtitle.line}”`, c: '#e8d5ab', s: 19 });
    if (subtitle.cue) lines.push({ t: subtitle.cue, c: 'rgba(190,120,90,0.9)', s: 14 });

    const h = 34 + lines.length * 30;
    ctx.fillStyle = 'rgba(3,2,1,0.82)';
    ctx.beginPath();
    ctx.roundRect(x, y - 26, w, h, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,94,48,0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    let ly = y + 4;
    for (const l of lines) {
      text(ctx, l.t, VIEW_W / 2, ly, { size: l.s, colour: l.c, align: 'center' });
      ly += 30;
    }
    ctx.restore();
  }

  function drawIntro(ctx) {
    scrim(ctx, 0.92);
    const r = rect(VIEW_W / 2 - 400, 110, 800, 660);
    panel(ctx, r);
    text(ctx, `DAY ${day}`, VIEW_W / 2, r.y + 66, { size: 15, colour: P.amberDim, align: 'center', spacing: 8 });
    text(ctx, cfg.title, VIEW_W / 2, r.y + 108, { size: 30, colour: P.amberBright, align: 'center', spacing: 4 });
    text(ctx, fmtDate(dateForDay(day)), VIEW_W / 2, r.y + 138, { size: 13, colour: P.amberDim, align: 'center', spacing: 3 });

    let y = r.y + 196;
    text(ctx, 'TODAY\'S BULLETIN', r.x + 60, y, { size: 12, colour: P.amberDim, spacing: 4 });
    y += 30;
    for (const rule of cfg.rules) {
      const used = paragraph(ctx, `· ${rule}`, r.x + 60, y, r.w - 120, { size: 14, colour: '#d8c39a' });
      y += used + 8;
    }

    if (cfg.story) {
      y += 14;
      paragraph(ctx, cfg.story, r.x + 60, y, r.w - 120, { size: 14, colour: 'rgba(180,140,92,0.75)' });
    }

    text(ctx, `${plan.length} EXPECTED AT THE DOOR`, VIEW_W / 2, r.y + r.h - 92, {
      size: 13, colour: P.amberDim, align: 'center', spacing: 3,
    });
    if (button(ctx, input, rect(VIEW_W / 2 - 150, r.y + r.h - 68, 300, 46), 'OPEN THE DOOR  [SPACE]')) {
      startShift();
    }
    input.consumeRemaining();
  }

  function drawDebug(ctx) {
    const lines = [
      `case ${index + 1}/${plan.length}  kind=${current.kind}  MIMIC=${current.isMimic}`,
      `unit=${current.claim.unit}  questions=${questionsLeft}`,
      ...current.discrepancies.map((d) => `· [${d.category}] ${d.note}`),
      ...(current.lies.length ? [`lies about: ${current.lies.join(', ')}`] : []),
      ...(current.quirks || []).map((q) => `~ quirk: ${q}`),
    ];
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(10, 10, 720, 20 + lines.length * 17);
    lines.forEach((l, i) => {
      text(ctx, l, 20, 30 + i * 17, {
        size: 12,
        colour: i === 0 ? (current.isMimic ? '#ff8a7a' : '#8ad48a') : '#c9b98a',
      });
    });
    ctx.restore();
  }

  return {
    update,
    render,
    handlesEscape: () => view !== 'DESK',
    // Read by the browser test harness.
    debugState: () => ({ view, phase, index, total: plan.length, questionsLeft, isMimic: current && current.isMimic }),
  };
}

  __exp["createDeskScene"] = createDeskScene;

__defs["src/scenes/shiftEnd.js"] = (__exp) => {
// End of shift. You are paid for bodies processed and beds filled. What you are
// not told is whether any of the bodies you let past were wearing a face.

const { VIEW_W, VIEW_H, rect } = __req("src/core/input.js");
const { P } = __req("src/art/palette.js");
const { drawRoom } = __req("src/art/room.js");
const { drawDesk } = __req("src/art/desk.js");
const { vignette } = __req("src/art/lighting.js");
const { text, panel, button, meter, paragraph } = __req("src/ui/widgets.js");
const { state } = __req("src/core/state.js");
const { shiftEarnings, reputationLabel, REP_MAX } = __req("src/sim/economy.js");
const { payPerApplicant, rentPerResident } = __req("src/sim/upgrades.js");
const { sfx } = __req("src/core/audio.js");
const { dayConfig } = __req("src/sim/day.js");
const { fmtDate, dateForDay } = __req("src/sim/identity.js");

function createShiftEndScene(game, opts = {}) {
  const input = game.input;
  const results = opts.results || [];
  const day = opts.day || state.day;

  const seen = results.length;
  const admitted = results.filter((r) => r.admitted).length;
  const refused = seen - admitted;
  const complaints = results.filter((r) => !r.admitted && !r.case.isMimic).length;

  const earn = shiftEarnings(seen);
  let paid = false;
  let reveal = 0;

  function update(dt) {
    reveal = Math.min(1, reveal + dt * 0.9);
    if (!paid && reveal > 0.15) {
      paid = true;
      state.money += earn.total;
      state.stats.daysSurvived = Math.max(state.stats.daysSurvived, day);
      sfx.coin();
    }
  }

  function render(ctx) {
    drawRoom(ctx, { px: 0, py: 0, lamp: 0.5, sway: game.t * 0.3, horizon: 560 });
    drawDesk(ctx, { px: 0, py: 0, lamp: 0.5 });
    vignette(ctx, 1);

    const r = rect(VIEW_W / 2 - 420, 90, 840, 700);
    panel(ctx, r);

    text(ctx, 'SHIFT ENDED', VIEW_W / 2, r.y + 58, { size: 26, colour: P.amberBright, align: 'center', spacing: 8 });
    text(ctx, `DAY ${day} · ${fmtDate(dateForDay(day))} · ${dayConfig(day).title}`, VIEW_W / 2, r.y + 88, {
      size: 12, colour: P.amberDim, align: 'center', spacing: 3,
    });

    const rows = [
      ['APPLICANTS SEEN', `${seen}`, null],
      ['ADMITTED', `${admitted}`, null],
      ['REFUSED', `${refused}`, null],
      ['—', '', null],
      [`WAGES  (${seen} × ${payPerApplicant()})`, `+${earn.wages}`, P.ok],
      [`RENT  (${earn.residents} × ${rentPerResident()})`, `+${earn.rent}`, P.ok],
    ];
    if (complaints > 0) {
      rows.push([`COMPLAINTS FILED  (${complaints})`, 'STANDING DOWN', P.danger]);
    }

    let y = r.y + 150;
    for (const [label, value, colour] of rows) {
      if (label === '—') {
        ctx.fillStyle = 'rgba(140,110,60,0.28)';
        ctx.fillRect(r.x + 70, y - 6, r.w - 140, 1.5);
        y += 22;
        continue;
      }
      text(ctx, label, r.x + 70, y, { size: 15, colour: '#c9b58c' });
      text(ctx, value, r.x + r.w - 70, y, { size: 15, colour: colour || '#e8d5ab', align: 'right' });
      y += 34;
    }

    y += 12;
    ctx.fillStyle = 'rgba(140,110,60,0.4)';
    ctx.fillRect(r.x + 70, y - 8, r.w - 140, 2);
    y += 26;
    text(ctx, 'TAKINGS', r.x + 70, y, { size: 19, colour: P.amberBright, spacing: 2 });
    text(ctx, `+${earn.total}`, r.x + r.w - 70, y, { size: 22, colour: '#f0c274', align: 'right' });

    y += 52;
    text(ctx, `STANDING — ${reputationLabel()}`, r.x + 70, y, { size: 13, colour: P.amberDim, spacing: 2 });
    meter(ctx, rect(r.x + 70, y + 14, r.w - 140, 12), state.reputation, REP_MAX);

    y += 62;
    paragraph(ctx, admitted > 0
      ? 'Beds are full that were empty this morning. Everyone you let past is asleep under your roof tonight.'
      : 'Nobody sleeps here tonight who did not sleep here last night. Quiet, at least.',
    r.x + 70, y, r.w - 140, { size: 13, colour: 'rgba(178,142,88,0.72)' });

    if (button(ctx, input, rect(VIEW_W / 2 - 170, r.y + r.h - 66, 340, 48), 'TO THE OFFICE  →')) {
      sfx.click();
      game.switchTo('shop', { day });
    }
    input.consumeRemaining();
  }

  return { update, render };
}

  __exp["createShiftEndScene"] = createShiftEndScene;

};

// Between the shift and the night: spend what you took. Four columns, four very
// different theories about what keeps a building alive.

const { VIEW_W, VIEW_H, rect } = __req("src/core/input.js");
const { P, rgba } = __req("src/art/palette.js");
const { vignette } = __req("src/art/lighting.js");
const { text, panel, button, paragraph, wrapLines } = __req("src/ui/widgets.js");
const { state, hasUpgrade, save } = __req("src/core/state.js");
const { UPGRADES, BRANCHES, purchase, isAvailable, upgradeById } = __req("src/sim/upgrades.js");
const { sfx } = __req("src/core/audio.js");
const { drawHud } = __req("src/ui/hud.js");

function createShopScene(game, opts = {}) {

// The Night Shift. If anything you admitted was wearing a face, it may use the
// dark. The scene that follows is generated so that the clues *actually* isolate
// the culprit: traits are chosen greedily until exactly one suspect survives.

const { makeRng } = __req("src/core/rng.js");
const { state } = __req("src/core/state.js");
const { securityFactor, extraClues, canInterruptMurder } = __req("src/sim/upgrades.js");

const ROOMS = [
  { id: 'hall', name: 'THIRD FLOOR HALL', blurb: 'The bulb at the far end has been out for weeks.' },
  { id: 'unit', name: 'THE UNIT', blurb: 'The door was not forced. That is the first thing you notice.' },
  { id: 'laundry', name: 'LAUNDRY', blurb: 'Standing water. Something was rinsed here in a hurry.' },
  { id: 'boiler', name: 'BOILER ROOM', blurb: 'Warm. Too warm. The only warm room in the building.' },
  { id: 'stair', name: 'BACK STAIR', blurb: 'Nobody uses it. Something has been using it.' },
];

// Each trait yields a clue that names one value and rules out everyone else.
const TRAITS = [
  {
    id: 'build',
    of: (r) => r.identity.features.build,
    clue: (v) => `Hoofprints pressed into the ash, deep and wide. The tread of something ${v.toLowerCase()}.`,
    label: (v) => `TREAD: ${v}`,
  },
  {
    id: 'eyes',
    of: (r) => r.identity.features.eyeColour,
    clue: (v) => `A film of shed eye-skin on the sill, dried and curled. Held to the light it is ${v.toLowerCase()}.`,
    label: (v) => `EYES: ${v}`,
  },

    id: 'ear',

    clue: (v) => (v === 'none'

    label: (v) => `EAR: ${v === 'none' ? 'WHOLE' : v.toUpperCase() + ' NOTCH'}`,

    clue: (v) => (v === 'TUSKED'

    label: (v) => `MARK: ${v === 'none' ? 'UNSCARRED' : v.toUpperCase() + ' SCAR'}`,

    id: 'hide',
    of: (r) => (r.identity.features.hide % 2 === 0 ? 'PALE' : 'DARK'),
    clue: (v) => `Bristles in the drain trap, a good handful. ${v === 'PALE' ? 'Pale as tallow.' : 'Dark as wet rope.'}`,
    label: (v) => `HIDE: ${v}`,

  'A chair is set neatly against the wall. Nothing else in the room is neat.',
  'There is no sign of a struggle. There is a great deal of sign of an ending.',
  'Somebody wiped the handle. Only the handle.',
  'The floor is warm here and nowhere else.',
  'A tooth on the boards. It is not a pig\'s tooth. It is very nearly one.',
];

/** Does anything happen tonight? */
function rollNight(day, seed) {
  const rng = makeRng(seed * 77 + day * 913);
  const mimics = state.residents.filter((r) => r.alive && r.isMimic);
  if (mimics.length === 0) return { murder: false, mimics: 0, interrupted: false };

  const perMimic = 0.55 * securityFactor();
  const chance = 1 - Math.pow(1 - perMimic, mimics.length);
  const happened = rng.chance(chance);
  if (!happened) return { murder: false, mimics: mimics.length, interrupted: false };

  }

/**
 * Builds the crime scene. Guarantees the clue set narrows the suspects to
 * exactly one — the culprit — before any flavour clues are added.

function buildScene(day, seed) {

      text: best.clue(value),
      label: best.label(value),

  // very thin night. Top up with further true statements about them — they cost
  // the player nothing to believe and give the evidence sheet some body.
  while (clues.length < 3 && pool.length > 0) {
    const trait = pool.pop();
    const value = trait.of(culprit);
    clues.push({
      id: trait.id,
      trait: trait.id,

      text: trait.clue(value),
      label: trait.label(value),
      eliminating: true,

  }

  if (!game.paused && game.scene && game.scene.update && !game.pending) {
    game.scene.update(dt);
  }
}

function render(ctx, dt) {
  ctx.save();
  if (game.shakeAmount > 0.05) {
    ctx.translate(
      (Math.random() - 0.5) * game.shakeAmount,
      (Math.random() - 0.5) * game.shakeAmount,
    );
  }

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  if (game.scene && game.scene.render) game.scene.render(ctx, dt);
  ctx.restore();

  if (game.paused) drawPause(ctx);

  grain(ctx, 0.045);

  if (game.fade > 0.01) {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(1, game.fade)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  input.endFrame();
}

function drawPause(ctx) {
  scrim(ctx, 0.86);
  const r = rect(VIEW_W / 2 - 220, VIEW_H / 2 - 170, 440, 340);
  panel(ctx, r);
  text(ctx, 'SHIFT PAUSED', VIEW_W / 2, r.y + 62, { size: 24, colour: P.amberBright, align: 'center', spacing: 6 });
  text(ctx, 'The queue waits. It is very patient.', VIEW_W / 2, r.y + 92, {
    size: 12, colour: 'rgba(160,130,78,0.7)', align: 'center',
  });

  if (button(ctx, input, rect(r.x + 70, r.y + 130, 300, 46), 'RESUME')) {
    game.paused = false;
    sfx.click();
  }
  if (button(ctx, input, rect(r.x + 70, r.y + 186, 300, 46), isMuted() ? 'SOUND: OFF' : 'SOUND: ON')) {
    setMuted(!isMuted());
    state.settings.muted = isMuted();
    sfx.click();
  }
  if (button(ctx, input, rect(r.x + 70, r.y + 242, 300, 46), 'SAVE AND QUIT TO TITLE')) {
    save();
    game.paused = false;
    game.switchTo('menu');
  }
  input.consumeRemaining();
}

// --- boot -------------------------------------------------------------------

function boot() {
  if (hasSave()) load();
  if (state.settings && state.settings.muted) setMuted(true);

  const kick = () => {
    unlock();
    window.removeEventListener('pointerdown', kick);
    window.removeEventListener('keydown', kick);
  };
  window.addEventListener('pointerdown', kick);
  window.addEventListener('keydown', kick);

  enterScene('menu', {});
  startLoop({ canvas, ctx, update, render });

  const bootEl = document.getElementById('boot');
  if (bootEl) {
    bootEl.classList.add('gone');
    setTimeout(() => bootEl.remove(), 900);
  }
}

boot();

  __exp["game"] = game;

};
__req("src/main.js");
})();
</script>
