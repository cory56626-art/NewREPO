<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacing Hams</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #d8c39a;
    font-family: "Courier New", Courier, monospace;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #000;
  }
  canvas {
    display: block;
    image-rendering: auto;
    cursor: default;
  }
  canvas.pointing { cursor: pointer; }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #000;
    color: #6b5836;
    letter-spacing: .3em;
    font-size: 13px;
    z-index: 10;
    transition: opacity .6s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="boot">PACING HAMS</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
